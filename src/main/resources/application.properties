spring.application.name=order-inventory-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/orders}
spring.datasource.username=${DB_USER:orders}
spring.datasource.password=${DB_PASSWORD:orders}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# The schema is owned by Flyway migrations; Hibernate only validates against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
